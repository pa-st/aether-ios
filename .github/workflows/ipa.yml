name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: python3 tools/gen_project.py

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project Aether.xcodeproj \
            -target Aether \
            -configuration Release \
            -archivePath build/Aether.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Aether.xcarchive/Products/Applications/Aether.app Payload/
          zip -r Aether-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-unsigned.ipa
          path: Aether-unsigned.ipa
