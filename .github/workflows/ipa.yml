name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: python3 tools/gen_project.py

      - name: Build (unsigned, device SDK)
        run: |
          xcodebuild build \
            -project Aether.xcodeproj \
            -scheme Aether \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            VALIDATE_PRODUCT=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Aether.app Payload/
          zip -r Aether-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-unsigned.ipa
          path: Aether-unsigned.ipa
